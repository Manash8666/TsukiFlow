version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tsuki_user
      POSTGRES_PASSWORD: tsuki_password
      POSTGRES_DB: tsukiflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://tsuki_user:tsuki_password@db/tsukiflow
      - JWT_SECRET=${JWT_SECRET:-tsukiflow_production_secret_key_99182}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
